# 車隊無線電自動轉文字：每 6 小時檢查一次，有新的已結束正賽就把無線電轉成文字並更新網站
name: 無線電轉文字

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcribe-radio
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # 快取 Whisper 模型，避免每次重新下載
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 轉錄無線電
        run: python scripts/transcribeRadio.py

      - name: 有更新時提交
        run: |
          if git diff --quiet -- data/radioTranscripts.json && git ls-files --error-unmatch data/radioTranscripts.json >/dev/null 2>&1; then
            echo "沒有新的文字稿"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radioTranscripts.json
          git commit -m "chore: 更新車隊無線電文字稿"
          git pull --rebase
          git push
